[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogeneous-network-simulation"
version = "0.1.0"
description = "Heterogeneous UAV network simulation with pluggable algorithms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
codrone = [
    "codrone-edu",
]
tello = [
    "djitellopy",
    "opencv-python",
]

[project.scripts]
simulation-ui = "simulation_app.ui.main_window:main"

[tool.setuptools.packages.find]
include = [
    "simulation_app*",
    "simulation_core*",
    "algorithms*",
    "user_algorithms*",
]
